<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSO Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/brand/mark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-row">
      <a class="brand" href="/" aria-label="Back to the public site">
        <img src="/brand/mark" alt="" class="brand-mark" width="52" height="52">
        <span class="brand-text"><span class="l1">PSUT Community</span><span class="l2">Service Office</span></span>
        <span class="admin-badge">Admin</span>
      </a>
      <nav class="admin-tabs" id="tabs" aria-label="Admin sections" hidden>
        <a href="#events" data-tab="events">Events</a>
        <a href="#attendance" data-tab="attendance">Check-in</a>
        <a href="#credits" data-tab="credits">Credits</a>
        <a href="#teams" data-tab="teams">Teams</a>
        <a href="#students" data-tab="students">Students</a>
        <button type="button" id="logout">Sign out</button>
      </nav>
    </div>
  </header>

  <main id="admin" class="wrap" tabindex="-1"></main>

  <dialog id="modal" class="modal"><div class="modal-inner" id="modal-body"></div></dialog>

  <script src="/admin.js"></script>
</body>
</html>
